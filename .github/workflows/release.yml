---
name: Publish OCI chart

on:
  workflow_dispatch:
    inputs:
      chart:
        description: Chart directory name under charts/
        required: true
        type: string
      version:
        description: Exact chart version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.chart }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Validate inputs and metadata
        id: metadata
        shell: pwsh
        env:
          CHART_NAME: ${{ inputs.chart }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CHART_NAME -notmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') {
            throw "Invalid chart name."
          }
          if ($env:EXPECTED_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Version must be Semantic Versioning."
          }
          $path = Join-Path "charts" $env:CHART_NAME
          if (-not (Test-Path (Join-Path $path "Chart.yaml"))) {
            throw "Chart '$env:CHART_NAME' does not exist on main."
          }
          $actualName = helm show chart $path |
            Select-String '^name:\s*(.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          $actualVersion = helm show chart $path |
            Select-String '^version:\s*(.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          if ($actualName -ne $env:CHART_NAME) { throw "Chart metadata name does not match." }
          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "Chart.yaml version '$actualVersion' does not match requested '$env:EXPECTED_VERSION'."
          }

      - name: Log in to GHCR
        shell: bash
        env:
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$HELM_PASSWORD" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Prevent version overwrite
        shell: bash
        env:
          CHART_NAME: ${{ inputs.chart }}
          CHART_VERSION: ${{ inputs.version }}
        run: |
          set +e
          output="$(helm show chart \
            "oci://ghcr.io/nicosmuts/charts/${CHART_NAME}" \
            --version "${CHART_VERSION}" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Chart version already exists and is immutable."
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|not_found' <<<"$output"; then
            echo "$output"
            echo "Registry check failed for an unexpected reason; refusing to publish."
            exit 1
          fi

      - name: Verify and package
        shell: pwsh
        run: |
          ./scripts/helm-charts.ps1 verify
          ./scripts/helm-charts.ps1 package

      - name: Push OCI artifact
        shell: bash
        env:
          CHART_NAME: ${{ inputs.chart }}
          CHART_VERSION: ${{ inputs.version }}
        run: |
          package="dist/${CHART_NAME}-${CHART_VERSION}.tgz"
          test -f "$package"
          helm push "$package" oci://ghcr.io/nicosmuts/charts
          {
            echo "## Published chart"
            echo
            echo "\`${CHART_NAME}:${CHART_VERSION}\`"
            echo
            echo "\`oci://ghcr.io/nicosmuts/charts/${CHART_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
