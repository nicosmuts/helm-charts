{{- if .Values.podDisruptionBudget.enabled }}
{{- if and (ne .Values.podDisruptionBudget.minAvailable nil) (ne .Values.podDisruptionBudget.maxUnavailable nil) }}
{{- fail "podDisruptionBudget.minAvailable and maxUnavailable are mutually exclusive" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "avalonhome-prometheus-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avalonhome-prometheus-exporter.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "avalonhome-prometheus-exporter.selectorLabels" . | nindent 6 }}
{{- end }}
