---
replicaCount: 1

image:
  repository: ghcr.io/brav0charlie/avalonhome-prometheus-exporter
  tag: "v0.3.2"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels: {}

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  labels: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

config:
  avalonIP: "192.168.1.50"
  avalonIPs: []
  avalonPort: 4028
  updateInterval: 15
  exporterPort: 9100
  exportChipMetrics: false
  minerTimeout: 5.0
  enableDebugEndpoint: false
  logLevel: INFO

service:
  type: ClusterIP
  port: 9100
  annotations: {}
  labels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 30
  successThreshold: 1

revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
terminationGracePeriodSeconds: 30

priorityClassName: ""
runtimeClassName: ""
dnsPolicy: ClusterFirst
dnsConfig: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
extraContainers: []
initContainers: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  ingress:
    allowExternal: true
    from: []
  additionalIngress: []
  egress: []
  policyTypes:
    - Ingress

serviceMonitor:
  enabled: false
  namespace: ""
  annotations: {}
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  scheme: http
  honorLabels: false
  relabelings: []
  metricRelabelings: []
  tlsConfig: {}

test:
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
