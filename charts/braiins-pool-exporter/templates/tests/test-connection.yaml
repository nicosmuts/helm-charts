apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "braiins-pool-exporter.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "braiins-pool-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.test.securityContext | nindent 8 }}
      command:
        - /bin/sh
        - -ec
      args:
        - >-
          wget -qO- http://{{ include "braiins-pool-exporter.fullname" . }}:
          {{- .Values.service.port }}/-/healthy | grep -q healthy
